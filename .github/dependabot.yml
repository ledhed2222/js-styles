version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps land as one PR. Majors stay separate: these
      # packages are published shared configs, so a major bump to a
      # dependency or peerDependency range changes what every consumer's
      # project is told is compatible, and deserves its own reviewable PR.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
