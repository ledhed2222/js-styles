name: Lint

# No deploy/publish workflow chains into this one (unlike gregweisbrod.com's
# lint.yml), so push:master is the only thing covering master directly;
# pull_request already covers the merge commit for PRs.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
